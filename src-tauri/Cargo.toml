[package]
name = "codera"
version = "0.1.2"
description = "Codera for the desktop"
authors = ["Codera"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "codera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

# Fullscreen on macOS adjusts AppKit's presentation options directly.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "bitflags", "NSApplication"] }
